<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>专注 · 休息</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="https://cdn.jsdelivr.net/npm/lucide-static@1.44.0/icons/hourglass.svg"
  >
  <style>
    :root {
      --orange: #E87936;
      --blue: #4772B8;
      --home-bg: #EEEAE4;
      --home-fg: #68717C;
      --white: #FFFFFF;
      --ui-fade: 380ms;
      --ui-ease: cubic-bezier(.22, .61, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--home-bg);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button {
      font: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    :focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 7px;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* 页面本身不做透明度动画。所有进出场只由同一个圆形遮罩负责。 */
    .page {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .home {
      z-index: 2;
      background: var(--home-bg);
    }

    .choices {
      --home-padding: 40px;
      --choice-gap: clamp(34px, 7vw, 104px);
      --choice-size: clamp(190px, 27vw, 360px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--choice-gap);
      width: 100%;
      padding: var(--home-padding);
    }

    .choice {
      width: min(var(--choice-size), calc((100vw - 2 * var(--home-padding) - var(--choice-gap)) / 2), calc(100dvh - 160px));
      aspect-ratio: 1;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      padding: 0;
      color: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-shadow: 0 18px 54px rgba(21, 31, 48, .075);
      filter: brightness(1) saturate(1);
      transition:
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    /*
    悬停只改变光感、阴影和圆内文字，不移动或缩放圆本身。
    这样既有“已选中”的反馈，又不会破坏圆形扩散/收缩的几何一致性。
  */
    @media (hover: hover) {
      .choice:hover {
        box-shadow: 0 24px 64px rgba(21, 31, 48, .11);
        filter: brightness(1.018) saturate(1.025);
      }

      .choice:hover .choice-label {
        transform: translateY(-2px) scale(1.018);
      }
    }

    .choice.orange {
      background: var(--orange);
    }

    .choice.blue {
      background: var(--blue);
    }

    .choice-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      line-height: 1.05;
      font-weight: 650;
      letter-spacing: .035em;
      transform: translateY(0) scale(1);
      transition: transform 180ms cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    .choice-label .main {
      font-size: clamp(29px, 3vw, 48px);
    }

    .choice-label .sub {
      font-size: clamp(20px, 2vw, 31px);
      font-weight: 580;
      opacity: .94;
    }

    .unit {
      margin-left: .18em;
    }

    /* 提示统一字号、盒模型和基线；计时页只有一个提示槽，不叠放透明链接。 */
    .hint {
      position: absolute;
      left: 50%;
      bottom: clamp(34px, 7vh, 76px);
      transform: translateX(-50%);
      margin: 0;
      padding: 10px 12px;
      border: 0;
      background: transparent;
      white-space: nowrap;
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 500;
      letter-spacing: .055em;
      line-height: 1;
      user-select: none;
    }

    .hint-line {
      display: inline-flex;
      align-items: baseline;
      gap: .34em;
    }

    .hint-key {
      letter-spacing: .025em;
    }

    .home-hint {
      color: var(--home-fg);
      cursor: pointer;
    }

    .home-hint:hover {
      color: #525B66;
    }

    /* 只移动文字，点击区域保持固定。
     向下拨动 -> 轻微越界回弹 -> 回到原位；随后留出较长静止时间。 */
    .app[data-phase="home"] .home-hint .hint-line {
      animation: homeHintNudge 3.8s infinite;
      will-change: transform;
    }

    @keyframes homeHintNudge {

      0%,
      5%,
      34%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      13% {
        transform: translate3d(0, 10px, 0);
        animation-timing-function: cubic-bezier(.22, .72, .28, 1);
      }

      21% {
        transform: translate3d(0, -1.8px, 0);
        animation-timing-function: cubic-bezier(.30, 0, .42, 1);
      }

      27% {
        transform: translate3d(0, .7px, 0);
        animation-timing-function: cubic-bezier(.22, .72, .28, 1);
      }
    }

    /* 专注和休息共用同一套计时布局；休息最后两分钟按既定规则切换前景色。 */
    .timer-view {
      z-index: 1;
      background: var(--orange);
      color: var(--white);
    }

    /* 长时渐变以极小步长更新；不再叠加持续运行的全屏背景 CSS 动画。 */
    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-1vh);
      opacity: 1;
      transition: opacity var(--ui-fade) var(--ui-ease);
    }

    .timer-view.idle .timer-wrap {
      opacity: 0;
      pointer-events: none;
    }

    .mode-label {
      display: flex;
      align-items: baseline;
      gap: .62em;
      margin-bottom: 30px;
      color: rgba(255, 255, 255, .70);
      font-size: clamp(16.25px, 1.5625vw, 22.5px);
      font-weight: 650;
      letter-spacing: .14em;
    }

    .mode-separator {
      opacity: .72;
      letter-spacing: 0;
    }

    .mode-duration {
      display: inline-flex;
      align-items: baseline;
      letter-spacing: .06em;
    }

    .timer-hint {
      color: rgba(255, 255, 255, .72);
      cursor: pointer;
    }

    .timer-view.idle .timer-hint {
      color: rgba(255, 255, 255, .68);
      cursor: default;
      pointer-events: none;
    }

    /* 横段、竖段使用同一长度和厚度。单位锚定实际数字组，不用百分比猜位置。 */
    .compact-clock {
      padding-bottom: clamp(20px, 2vw, 28px);
    }

    .seven {
      --seg-thickness: clamp(8px, .86vw, 12px);
      --seg-length: clamp(58px, 7.2vw, 96px);
      --digit-gap: clamp(8px, 1.1vw, 15px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: var(--digit-gap);
    }

    .time-group {
      position: relative;
    }

    .digit-pair {
      display: flex;
      gap: var(--digit-gap);
    }

    .compact-unit {
      /* 自身右边缘直接锚定本组数字盒子的最右边缘；
       该边缘正好也是最右侧竖向晶体管的外缘。 */
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      left: auto;
      display: block;
      width: max-content;
      margin: 0;
      padding: 0;
      text-align: right;
      color: rgba(255, 255, 255, .50);
      font-size: clamp(10px, .86vw, 13px);
      font-weight: 560;
      letter-spacing: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    .digit {
      position: relative;
      flex: 0 0 auto;
      width: calc(var(--seg-length) + 2 * var(--seg-thickness));
      height: calc(2 * var(--seg-length) + 3 * var(--seg-thickness));
    }

    .seg {
      position: absolute;
      background: rgba(255, 255, 255, .035);
      border-radius: 999px;
      transition: background-color 50ms linear;
    }

    .seg.on {
      background: rgba(255, 255, 255, .985);
      box-shadow: 0 0 20px rgba(255, 255, 255, .08);
    }

    .seg.h {
      left: var(--seg-thickness);
      width: var(--seg-length);
      height: var(--seg-thickness);
    }

    .seg.v {
      width: var(--seg-thickness);
      height: var(--seg-length);
    }

    .a {
      top: 0;
    }

    .g {
      top: calc(var(--seg-length) + var(--seg-thickness));
    }

    .d {
      bottom: 0;
    }

    .f {
      left: 0;
      top: var(--seg-thickness);
    }

    .b {
      right: 0;
      top: var(--seg-thickness);
    }

    .e {
      left: 0;
      top: calc(var(--seg-length) + 2 * var(--seg-thickness));
    }

    .c {
      right: 0;
      top: calc(var(--seg-length) + 2 * var(--seg-thickness));
    }

    .colon {
      position: relative;
      flex: 0 0 auto;
      width: calc(2.2 * var(--seg-thickness));
      height: calc(2 * var(--seg-length) + 3 * var(--seg-thickness));
    }

    .colon::before,
    .colon::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: var(--seg-thickness);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, .985);
    }

    .colon::before {
      top: 32%;
    }

    .colon::after {
      bottom: 32%;
    }

    /* 休息最后两分钟：前景统一切换为主页提示灰 #68717C。 */
    .timer-view.rest-ending .mode-label,
    .timer-view.rest-ending .timer-hint,
    .timer-view.rest-ending .compact-unit {
      color: var(--home-fg);
    }

    .timer-view.rest-ending .seg.on {
      background: var(--home-fg);
      box-shadow: 0 0 20px rgba(104, 113, 124, .08);
    }

    .timer-view.rest-ending .colon::before,
    .timer-view.rest-ending .colon::after {
      background: var(--home-fg);
    }

    /* 只有这一层承担圆形转场，同时拦截转场期间的点击，避免穿透。 */
    .transition-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      overflow: hidden;
      touch-action: none;
    }

    .transition-layer[hidden] {
      display: none;
    }

    .radial {
      position: absolute;
      border-radius: 50%;
      overflow: hidden;
      transform-origin: center;
      will-change: transform;
      pointer-events: none;
      backface-visibility: hidden;
    }

    .radial-tint {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      will-change: opacity;
    }

    .app[data-busy="true"] .timer-wrap,
    .app[data-busy="true"] .seg,
    .app[data-busy="true"] .timer-view {
      transition: none;
    }

    @media (max-width: 700px) {
      .choices {
        --home-padding: 20px;
        --choice-gap: 22px;
        --choice-size: clamp(150px, 41vw, 220px);
      }
    }

    @media (max-width: 480px) {
      .choices {
        --choice-gap: 14px;
      }

      .choice-label .main {
        font-size: 25px;
      }

      .choice-label .sub {
        font-size: 18px;
      }

      .seven {
        --seg-length: clamp(40px, 12vw, 58px);
        --seg-thickness: clamp(6px, 1.8vw, 8px);
        --digit-gap: clamp(6px, 1.8vw, 8px);
      }
    }

    @media (max-height: 480px) {
      .choice {
        width: min(var(--choice-size), calc((100vw - 2 * var(--home-padding) - var(--choice-gap)) / 2), calc(100dvh - 140px));
      }

      .seven {
        --seg-length: min(60px, 16vh);
        --seg-thickness: min(8px, 2.5vh);
      }

      .mode-label {
        margin-bottom: 18px;
      }

      .hint {
        bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app" data-phase="home" data-mode="home" data-busy="false">
    <main class="page home" id="home" aria-hidden="false">
      <div class="choices">
        <button type="button" class="choice orange" id="startFocus" aria-label="开始专注">
          <span class="choice-label"><span class="main">专注</span><span class="sub"><span>30+</span><span
                class="unit">分钟</span></span></span>
        </button>
        <button type="button" class="choice blue" id="startRest" aria-label="开始5分钟休息">
          <span class="choice-label"><span class="main">休息</span><span class="sub"><span>5</span><span
                class="unit">分钟</span></span></span>
        </button>
      </div>
      <button type="button" class="hint home-hint" id="homeStartHint" aria-label="开始专注">
        <span class="hint-line"><span>单击</span><span class="hint-key">空格键␣</span><span>开始。</span></span>
      </button>
      </main>
      <section class="page timer-view hidden" id="timerView" aria-hidden="true" inert>
        <div class="timer-wrap" id="timerContent">
        <div class="mode-label"><span id="modeName">专注</span><span class="mode-separator">-</span><span
            class="mode-duration"><span id="modeDurationValue">30+</span><span class="unit">分钟</span></span></div>
        <div class="compact-clock">
          <div class="seven" id="timerDisplay" role="img" aria-label="0分0秒">
            <div class="time-group">
              <div class="digit-pair" id="leftDigits" aria-hidden="true"></div><span class="compact-unit" id="unitLeft"
                aria-hidden="true">分</span>
            </div>
            <div class="colon" aria-hidden="true"></div>
            <div class="time-group">
              <div class="digit-pair" id="rightDigits" aria-hidden="true"></div><span class="compact-unit" id="unitRight"
                aria-hidden="true">秒</span>
            </div>
          </div>
        </div>
        </div>
        <!-- 单一提示槽：隐藏态是普通文字；显示态才具有中断/休息/完成的操作语义。 -->
        <p class="hint timer-hint" id="actionHint" role="button" tabindex="0">
        <span class="hint-line" id="actionHintLine"><span id="hintPress">双击</span><span class="hint-key">空格键␣</span><span
            id="hintVerb">中断。</span></span>
        </p>
        </section>
        <div class="transition-layer" id="transitionLayer" aria-hidden="true" hidden>
      <div class="radial" id="transitionCircle">
        <div class="radial-tint" id="transitionTint"></div>
      </div>
    </div>
  </div>
  <script>
      (() => {
        'use strict';

      /* ---------- 常量与 DOM ---------- */

      const FOCUS_TARGET = 30 * 60 * 1000;
      const REST_DURATION = 5 * 60 * 1000;
      const DISPLAY_CAP = 100 * 60 * 60 * 1000;
      const REST_ENDING = 2 * 60 * 1000;
      const DOUBLE_SPACE_MS = 260;

      // 进入与退出共用同一组关键帧；退出仅反向播放。
      const MOTION = Object.freeze({
        duration: 500,
        easing: 'cubic-bezier(.45,0,.55,1)',
        fill: 'both'
      });

      const $ = id => document.getElementById(id);
      const ui = Object.freeze({
        app: $('app'),
        home: $('home'),
        timer: $('timerView'),
        content: $('timerContent'),
        hint: $('actionHint'),
        hintLine: $('actionHintLine'),
        hintPress: $('hintPress'),
        hintVerb: $('hintVerb'),
        display: $('timerDisplay'),
        leftDigits: $('leftDigits'),
        rightDigits: $('rightDigits'),
        unitLeft: $('unitLeft'),
        unitRight: $('unitRight'),
        modeName: $('modeName'),
        modeDuration: $('modeDurationValue'),
        startFocus: $('startFocus'),
        startRest: $('startRest'),
        homeStartHint: $('homeStartHint'),
        transitionLayer: $('transitionLayer'),
        transitionCircle: $('transitionCircle'),
        transitionTint: $('transitionTint')
      });

      const rootStyle = getComputedStyle(document.documentElement);
      const color = name => rootStyle.getPropertyValue(`--${name}`).trim();
      const COLORS = Object.freeze({
        orange: color('orange'),
        blue: color('blue'),
        home: color('home-bg')
      });

      const MODES = Object.freeze({
        focus: Object.freeze({
          title: '专注',
          durationLabel: '30+',
          start: COLORS.orange,
          end: COLORS.blue,
          span: FOCUS_TARGET,
          autoHide: true,
          button: ui.startFocus
        }),
        rest: Object.freeze({
          title: '休息',
          durationLabel: '5',
          start: COLORS.blue,
          end: COLORS.home,
          span: REST_DURATION,
          autoHide: false,
          button: ui.startRest
        })
      });

      const HINTS = Object.freeze({
        show: ['单击', '显示。'],
        complete: ['单击', '完成。'],
        rest: ['双击', '休息。'],
        interrupt: ['双击', '中断。']
      });

      const BUSY_PHASES = new Set(['entering', 'leaving', 'switching']);

      const state = {
        mode: 'home',
        phase: 'home',
        hidden: false,
        startedAt: 0,
        generation: 0
      };

      const runtime = {
        loop: null,
        autoHide: null,
        pendingSpace: null,
        lastSpaceAt: 0,
        pointerPress: null,
        animations: [],
        lastBackground: '',
        lastHint: '',
        lastDisplay: ''
      };

      const isBusy = () => BUSY_PHASES.has(state.phase);
      const isTimer = () => state.mode === 'focus' || state.mode === 'rest';
      const elapsed = () => Math.max(0, Date.now() - state.startedAt);

      function clearSpace() {
        if (runtime.pendingSpace !== null) clearTimeout(runtime.pendingSpace);
        runtime.pendingSpace = null;
        runtime.lastSpaceAt = 0;
      }

      function clearAutoHide() {
        if (runtime.autoHide !== null) clearTimeout(runtime.autoHide);
        runtime.autoHide = null;
      }

      function stopLoop() {
        if (runtime.loop !== null) clearTimeout(runtime.loop);
        runtime.loop = null;
      }

      /* ---------- 页面与状态 ---------- */

      function setPhase(phase) {
        state.phase = phase;
        ui.app.dataset.phase = phase;
        ui.app.dataset.mode = state.mode;
        ui.app.dataset.busy = String(isBusy());

        ui.home.inert = phase !== 'home';
        ui.timer.inert = !['running', 'alarming'].includes(phase);

        if (!isBusy()) return;

        clearSpace();
        const active = document.activeElement;
        if (active instanceof HTMLElement && active !== document.body) active.blur();
      }

      function showPage(page) {
        const onHome = page === 'home';
        ui.home.classList.toggle('hidden', !onHome);
        ui.timer.classList.toggle('hidden', onHome);
        ui.timer.classList.toggle('active', !onHome);
        ui.home.setAttribute('aria-hidden', String(!onHome));
        ui.timer.setAttribute('aria-hidden', String(onHome));
      }

      /* ---------- 七段数码管 ---------- */

      const SEGMENTS = Object.freeze({
        '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg',
        '5': 'acdfg', '6': 'acdefg', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg'
      });

      const digitNodes = [];

      function createDigit() {
        const node = document.createElement('div');
        node.className = 'digit';

        const parts = [];
        for (const name of 'abcdefg') {
          const part = document.createElement('span');
          part.className = `seg ${'agd'.includes(name) ? 'h' : 'v'} ${name}`;
          node.appendChild(part);
          parts.push([name, part]);
        }

        return { node, parts, value: '' };
      }

      for (let index = 0; index < 4; index++) {
        const digit = createDigit();
        (index < 2 ? ui.leftDigits : ui.rightDigits).appendChild(digit.node);
        digitNodes.push(digit);
      }

      const pad2 = value => String(value).padStart(2, '0');

      function formatTime(mode, value) {
        const ms = Math.max(0, value);

        if (mode === 'focus' && ms >= DISPLAY_CAP) {
          return { text: '99:99', left: '时', right: '分' };
        }

        if (mode === 'focus' && ms >= 120000) {
          const totalMinutes = Math.floor(ms / 60000);
          return {
            text: `${pad2(Math.floor(totalMinutes / 60))}:${pad2(totalMinutes % 60)}`,
            left: '时',
            right: '分'
          };
        }

        const totalSeconds = mode === 'rest'
          ? Math.ceil(ms / 1000)
          : Math.floor(ms / 1000);

        return {
          text: `${pad2(Math.floor(totalSeconds / 60))}:${pad2(totalSeconds % 60)}`,
          left: '分',
          right: '秒'
        };
      }

      function renderTime(mode, ms) {
        const data = formatTime(mode, ms);
        const renderKey = `${data.text}|${data.left}|${data.right}`;
        if (renderKey === runtime.lastDisplay) return;

        runtime.lastDisplay = renderKey;
        const value = data.text.replace(':', '');

        digitNodes.forEach((digit, index) => {
          const next = value[index];
          if (digit.value === next) return;

          digit.value = next;
          digit.node.dataset.value = next;
          const activeSegments = SEGMENTS[next];
          digit.parts.forEach(([name, part]) => {
            part.classList.toggle('on', activeSegments.includes(name));
          });
        });

        ui.display.dataset.value = data.text;
        ui.unitLeft.textContent = data.left;
        ui.unitRight.textContent = data.right;
        ui.display.setAttribute(
          'aria-label',
          `${Number(value.slice(0, 2))}${data.left}${Number(value.slice(2))}${data.right}`
        );
      }

      /* ---------- 颜色、提示与计时渲染 ---------- */

      const canMix = CSS.supports('color', 'color-mix(in oklab, #000, #fff)');
      const rgbCache = new Map();

      function parseHex(hex) {
        if (!rgbCache.has(hex)) {
          rgbCache.set(hex, [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)));
        }
        return rgbCache.get(hex);
      }

      function mixColor(from, to, progress) {
        const p = Math.round(Math.max(0, Math.min(1, progress)) * 10000) / 10000;
        if (p === 0) return from;
        if (p === 1) return to;

        if (canMix) {
          return `color-mix(in oklab, ${from} ${(1 - p) * 100}%, ${to} ${p * 100}%)`;
        }

        const a = parseHex(from);
        const b = parseHex(to);
        return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',')})`;
      }

      function actionForCurrentState() {
        if (state.phase === 'alarming') return 'complete';
        if (state.mode === 'focus' && elapsed() >= FOCUS_TARGET) return 'rest';
        return 'interrupt';
      }

      function updateHint() {
        const action = state.hidden ? 'show' : actionForCurrentState();
        if (action === runtime.lastHint) return;

        runtime.lastHint = action;
        const [press, verb] = HINTS[action];
        ui.hintPress.textContent = press;
        ui.hintVerb.textContent = verb;
        ui.hintLine.dataset.action = action;

        if (state.hidden) {
          ui.hint.removeAttribute('role');
          ui.hint.removeAttribute('tabindex');
        } else {
          ui.hint.setAttribute('role', 'button');
          ui.hint.tabIndex = 0;
        }
      }

      function setHidden(hidden, byUser = false) {
        if (byUser) {
          clearAutoHide();
          clearSpace();
        }

        state.hidden = Boolean(hidden);
        ui.timer.classList.toggle('idle', state.hidden);
        ui.content.inert = state.hidden;
        ui.content.setAttribute('aria-hidden', String(state.hidden));

        if (state.hidden && document.activeElement === ui.hint) ui.hint.blur();

        if (!state.hidden && isTimer()) {
          const time = state.mode === 'rest' ? REST_DURATION - elapsed() : elapsed();
          renderTime(state.mode, time);
        }

        updateHint();
      }

      function renderNow() {
        if (!isTimer()) return;

        const ms = elapsed();
        const config = MODES[state.mode];
        const background = mixColor(config.start, config.end, ms / config.span);

        if (background !== runtime.lastBackground) {
          ui.timer.style.backgroundColor = background;
          runtime.lastBackground = background;
        }

        const restRemaining = state.mode === 'rest'
          ? Math.max(0, REST_DURATION - ms)
          : Infinity;

        ui.timer.classList.toggle(
          'rest-ending',
          state.mode === 'rest' && restRemaining <= REST_ENDING
        );

        if (state.mode === 'rest' && ms >= REST_DURATION && state.phase === 'running') {
          finishRest();
          return;
        }

        if (!state.hidden && !document.hidden) {
          renderTime(state.mode, state.mode === 'rest' ? REST_DURATION - ms : ms);
        }

        updateHint();
      }

      function runLoop() {
        stopLoop();
        if (state.phase !== 'running') return;

        renderNow();
        if (state.phase !== 'running') return;

        const stableFocus = state.mode === 'focus' && elapsed() >= FOCUS_TARGET;
        const interval = document.hidden || stableFocus ? 1000 : 100;
        const untilRestEnds = state.mode === 'rest'
          ? Math.max(1, REST_DURATION - elapsed())
          : interval;

        runtime.loop = setTimeout(runLoop, Math.min(interval, untilRestEnds));
      }

      function configure(mode) {
        state.mode = mode;
        state.startedAt = Date.now();
        ui.timer.classList.remove('rest-ending');

        const config = MODES[mode];
        ui.modeName.textContent = config.title;
        ui.modeDuration.textContent = config.durationLabel;
        ui.timer.style.backgroundColor = config.start;
        runtime.lastBackground = config.start;

        renderTime(mode, mode === 'rest' ? REST_DURATION : 0);
        setHidden(false);
        updateHint();
      }

      function activateTimer() {
        // 转场不计入专注/休息时间。
        state.startedAt = Date.now();
        setPhase('running');
        updateHint();
        runLoop();

        if (!MODES[state.mode].autoHide) return;

        const generation = state.generation;
        runtime.autoHide = setTimeout(() => {
          runtime.autoHide = null;
          if (generation === state.generation && state.phase === 'running') setHidden(true);
        }, 5000);
      }

      /* ---------- 圆形转场 ---------- */

      function afterPaint() {
        if (document.hidden) return Promise.resolve();

        return new Promise(resolve => {
          let firstFrame = 0;
          let secondFrame = 0;
          let settled = false;

          const done = () => {
            if (settled) return;
            settled = true;
            cancelAnimationFrame(firstFrame);
            cancelAnimationFrame(secondFrame);
            document.removeEventListener('visibilitychange', onVisibilityChange);
            resolve();
          };

          const onVisibilityChange = () => {
            if (document.hidden) done();
          };

          document.addEventListener('visibilitychange', onVisibilityChange);
          firstFrame = requestAnimationFrame(() => {
            secondFrame = requestAnimationFrame(done);
          });
        });
      }

      function prepareCircle(mode, reverse, currentColor) {
        const config = MODES[mode];
        const rect = config.button.getBoundingClientRect();
        const size = rect.width;
        const x = rect.left + size / 2;
        const y = rect.top + size / 2;
        const radius = Math.hypot(
          Math.max(x, innerWidth - x),
          Math.max(y, innerHeight - y)
        ) + 2;
        const fullScale = radius / (size / 2);

        Object.assign(ui.transitionCircle.style, {
          width: `${size}px`,
          height: `${size}px`,
          left: `${x - size / 2}px`,
          top: `${y - size / 2}px`,
          backgroundColor: currentColor || config.start,
          transform: `translateZ(0) scale(${reverse ? fullScale : 1})`
        });

        ui.transitionTint.style.backgroundColor = currentColor || config.start;
        ui.transitionTint.style.opacity = reverse ? '1' : '0';
        ui.transitionLayer.hidden = false;

        return [
          { transform: 'translateZ(0) scale(1)' },
          { transform: `translateZ(0) scale(${fullScale})` }
        ];
      }

      async function playCircle(frames, reverse) {
        const finalFrame = frames[reverse ? 0 : 1];

        if (document.hidden || !ui.transitionCircle.animate) {
          ui.transitionCircle.style.transform = finalFrame.transform;
          ui.transitionTint.style.opacity = '0';
          return;
        }

        const options = { ...MOTION, direction: reverse ? 'reverse' : 'normal' };
        const animations = [ui.transitionCircle.animate(frames, options)];

        if (reverse) {
          animations.push(
            ui.transitionTint.animate([{ opacity: 0 }, { opacity: 1 }], options)
          );
        }

        runtime.animations = animations;
        await Promise.all(animations.map(animation => animation.finished.catch(() => { })));
      }

      function clearMotion() {
        // 先隐藏覆盖层，再取消 fill，避免圆在消失前跳回初始尺寸。
        ui.transitionLayer.hidden = true;
        runtime.animations.forEach(animation => animation.cancel());
        runtime.animations = [];
        ui.transitionCircle.removeAttribute('style');
        ui.transitionTint.removeAttribute('style');
      }

      async function enterMode(mode) {
        if (state.phase !== 'home' || !MODES[mode]) return;

        state.generation++;
        setPhase('entering');
        clearAutoHide();
        stopLoop();
        stopAlarm();
        configure(mode);

        try {
          const frames = prepareCircle(mode, false);
          await playCircle(frames, false);
          showPage(mode);
          await afterPaint();
        } finally {
          clearMotion();
          showPage(mode);
          activateTimer();
        }
      }

      async function goHome() {
        if (isBusy() || !isTimer()) return;

        const mode = state.mode;
        const currentColor = getComputedStyle(ui.timer).backgroundColor;

        state.generation++;
        stopLoop();
        clearAutoHide();
        stopAlarm();
        setPhase('leaving');

        try {
          const frames = prepareCircle(mode, true, currentColor);
          showPage('home');
          await afterPaint();
          await playCircle(frames, true);
        } finally {
          clearMotion();
          state.mode = 'home';
          state.startedAt = 0;
          state.hidden = false;
          ui.timer.classList.remove('idle');
          showPage('home');
          setPhase('home');
        }
      }

      async function switchToRest() {
        if (state.phase !== 'running' || state.mode !== 'focus') return;

        state.generation++;
        clearAutoHide();
        stopLoop();
        stopAlarm();
        setPhase('switching');

        const items = [ui.content, ui.hint];

        const fade = async (from, to) => {
          if (document.hidden) return;
          runtime.animations = items.map(element => element.animate(
            [{ opacity: from }, { opacity: to }],
            { duration: 140, easing: 'ease-in-out', fill: 'both' }
          ));
          await Promise.all(runtime.animations.map(animation => animation.finished.catch(() => { })));
        };

        const cancelFade = () => {
          runtime.animations.forEach(animation => animation.cancel());
          runtime.animations = [];
        };

        try {
          if (!state.hidden) await fade(1, 0);
          configure('rest');
          cancelFade();
          await fade(0, 1);
        } finally {
          cancelFade();
          activateTimer();
        }
      }

      function performDoubleAction() {
        if (state.phase !== 'running') return;

        clearAutoHide();
        clearSpace();

        if (state.mode === 'focus' && elapsed() >= FOCUS_TARGET) {
          void switchToRest();
        } else {
          void goHome();
        }
      }

      function finishRest() {
        stopLoop();
        clearAutoHide();
        clearSpace();
        setPhase('alarming');
        setHidden(false);
        renderTime('rest', 0);
        updateHint();
        startAlarm();
      }

      /* ---------- 指针与键盘 ---------- */

      document.addEventListener('pointerdown', () => {
        runtime.pointerPress = {
          generation: state.generation,
          blocked: isBusy(),
          hidden: state.hidden
        };

        if (!isBusy()) {
          clearSpace();
          clearAutoHide();
          unlockAudio();
        }
      }, { capture: true, passive: true });

      document.addEventListener('click', event => {
        const press = runtime.pointerPress;
        runtime.pointerPress = null;

        const stalePress = event.detail > 0 && press && (
          press.blocked || press.generation !== state.generation
        );

        if (isBusy() || event.detail > 1 || stalePress) return;

        clearSpace();
        const target = event.target;
        if (!(target instanceof Element)) return;

        if (state.phase === 'home') {
          if (target.closest('#startFocus, #homeStartHint')) {
            unlockAudio();
            void enterMode('focus');
          } else if (target.closest('#startRest')) {
            unlockAudio();
            void enterMode('rest');
          }
          return;
        }

        if (!ui.timer.contains(target)) return;

        if (state.phase === 'alarming') {
          void goHome();
          return;
        }

        if (state.phase !== 'running') return;

        // 指针按下时若界面是隐藏态，本次点击只负责恢复显示。
        if (state.hidden || (event.detail > 0 && press?.hidden)) {
          setHidden(false, true);
          return;
        }

        if (ui.hint.contains(target)) {
          performDoubleAction();
          return;
        }

        setHidden(true, true);
      });

      window.addEventListener('keydown', event => {
        if (event.code !== 'Space') {
          if (event.key === 'Enter' && document.activeElement === ui.hint && !state.hidden) {
            event.preventDefault();
            if (state.phase === 'alarming') void goHome();
            else performDoubleAction();
          }
          return;
        }

        if (event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;

        event.preventDefault();
        if (event.repeat || isBusy()) return;

        unlockAudio();
        clearAutoHide();

        if (state.phase === 'alarming') {
          clearSpace();
          void goHome();
          return;
        }

        if (state.phase === 'home') {
          void enterMode('focus');
          return;
        }

        if (state.phase !== 'running') return;

        const now = performance.now();
        if (runtime.pendingSpace !== null && now - runtime.lastSpaceAt <= DOUBLE_SPACE_MS) {
          clearSpace();
          performDoubleAction();
          return;
        }

        if (runtime.pendingSpace !== null) {
          clearSpace();
          setHidden(!state.hidden, true);
        }

        runtime.lastSpaceAt = now;
        const generation = state.generation;
        runtime.pendingSpace = setTimeout(() => {
          runtime.pendingSpace = null;
          if (state.phase === 'running' && state.generation === generation) {
            setHidden(!state.hidden, true);
          }
        }, DOUBLE_SPACE_MS);
      }, { passive: false });

      window.addEventListener('keyup', event => {
        if (event.code === 'Space') event.preventDefault();
      }, { passive: false });

      // 失焦只清理尚未完成的单双击判定，不改变显隐状态。
      window.addEventListener('blur', clearSpace);

      /* ---------- 提示音 ---------- */

      let audio = null;
      let alarmEpoch = 0;
      let alarmFallback = null;
      const soundNodes = new Set();

      function unlockAudio() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!audio && AudioContextClass) audio = new AudioContextClass();
          if (audio?.state === 'suspended') void audio.resume().catch(() => { });
        } catch (_) {
          // 静音环境不应影响计时或返回主页。
        }
      }

      function stopAlarm() {
        alarmEpoch++;
        clearTimeout(alarmFallback);
        alarmFallback = null;

        for (const voice of soundNodes) {
          try {
            voice.gain.gain.cancelScheduledValues(audio.currentTime);
            voice.gain.gain.setValueAtTime(0, audio.currentTime);
            voice.oscillator.stop();
            voice.oscillator.disconnect();
            voice.gain.disconnect();
          } catch (_) { }
        }

        soundNodes.clear();
      }

      function startAlarm() {
        stopAlarm();
        unlockAudio();

        const epoch = alarmEpoch;
        const rounds = 6;
        const roundLength = 2.9;
        const notes = Object.freeze([
          [523.25, 0, .23, .085],
          [659.25, .28, .23, .085],
          [783.99, .56, .34, .095]
        ]);
        const endMs = ((rounds - 1) * roundLength + .92) * 1000;

        const finish = () => {
          if (epoch === alarmEpoch && state.phase === 'alarming') void goHome();
        };

        if (audio) {
          try {
            const start = audio.currentTime;

            for (let round = 0; round < rounds; round++) {
              notes.forEach(([frequency, offset, duration, volume], noteIndex) => {
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();
                const time = start + round * roundLength + offset;

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, time);
                gain.gain.setValueAtTime(.0001, time);
                gain.gain.exponentialRampToValueAtTime(volume, time + .025);
                gain.gain.exponentialRampToValueAtTime(.0001, time + duration);
                oscillator.connect(gain);
                gain.connect(audio.destination);

                const voice = { oscillator, gain };
                soundNodes.add(voice);

                oscillator.onended = () => {
                  soundNodes.delete(voice);
                  oscillator.disconnect();
                  gain.disconnect();

                  if (round === rounds - 1 && noteIndex === notes.length - 1) finish();
                };

                oscillator.start(time);
                oscillator.stop(time + duration + .02);
              });
            }
          } catch (_) {
            // 仍保留无声自动返回。
          }
        }

        // 没有音频设备或 AudioContext 被暂停时，也能正常离开完成页。
        alarmFallback = setTimeout(finish, endMs + 100);
      }

      /* ---------- 生命周期 ---------- */

      function settleMotion() {
        runtime.animations.forEach(animation => {
          try { animation.finish(); } catch (_) { }
        });
      }

      window.addEventListener('resize', () => {
        if (isBusy()) settleMotion();
      });

      document.addEventListener('visibilitychange', () => {
        clearSpace();
        if (document.hidden) {
          if (isBusy()) settleMotion();
        } else if (state.phase === 'running') {
          runLoop();
        }
      });

      window.addEventListener('pagehide', () => {
        stopAlarm();
        clearSpace();
      });

          renderTime('focus', 0);
          setPhase('home');
        })();
      </script>
</body>

</html>
