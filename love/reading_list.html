<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>现代成年人通识书单</title>
<style>
:root{
  --paper:#f7f4ee;
  --ink:#191919;
  --muted:#74716b;
  --line:rgba(25,25,25,.075);
  --line-dark:rgba(25,25,25,.20);
  --warm:#7a3d2c;
  --wash:#f0ece5;
  --white:#fffefa;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    linear-gradient(to bottom, rgba(255,255,255,.25), rgba(255,255,255,0)),
    var(--paper);
  color:var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;
}
main{
  width:min(1520px, calc(100% - 48px));
  margin:0 auto;
  padding:72px 0 84px;
}
.masthead{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) minmax(240px,.55fr);
  gap:40px;
  align-items:end;
  padding-bottom:10px;
}
.eyebrow{
  font-size:.72rem;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--warm);
  font-weight:700;
  margin-bottom:12px;
}
h1{
  margin:0;
  max-width:16ch;
  font-family: Georgia, "Noto Serif SC","Songti SC", serif;
  font-size:clamp(2.6rem,5.2vw,6.1rem);
  line-height:.95;
  font-weight:500;
  letter-spacing:-.045em;
}
.deck{
  align-self:end;
  max-width:460px;
  color:#5b5751;
  font-family: Georgia, "Noto Serif SC","Songti SC", serif;
  font-size:1rem;
  line-height:1.72;
}
.deck strong{
  color:var(--ink);
  font-weight:600;
}
.section{
  margin-top:34px;
}
.section-head{
  display:block;
  margin-bottom:18px;
}
.section-title{
  margin:0;
  font-family: Georgia, "Noto Serif SC","Songti SC",serif;
  font-size:clamp(1.7rem,2.6vw,2.6rem);
  font-weight:500;
}
.controls{
  display:grid;
  grid-template-columns:minmax(280px,1fr) 220px 180px auto;
  gap:10px;
  margin:18px 0 14px;
}
input,select{
  appearance:none;
  width:100%;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.34);
  box-shadow:inset 0 0 0 1px rgba(25,25,25,.055);
  padding:10px 12px;
  color:var(--ink);
  font:inherit;
  outline:none;
}
input:focus,select:focus{
  background:rgba(255,255,255,.60);
  box-shadow:inset 0 0 0 1px rgba(122,61,44,.28),0 0 0 3px rgba(122,61,44,.05);
}
.count{
  display:flex;
  align-items:end;
  justify-content:flex-end;
  padding-bottom:9px;
  color:#8a867f;
  font-size:.78rem;
  letter-spacing:.03em;
  white-space:nowrap;
}
.table-frame{
  overflow:auto;
  max-height:76vh;
  background:rgba(255,254,250,.22);
}
table{
  border-collapse:collapse;
  width:max-content;
  min-width:100%;
  font-size:.82rem;
}
thead th{
  position:sticky;
  top:0;
  z-index:4;
  background:rgba(247,244,238,.94);
  backdrop-filter:blur(12px);
  color:#4d4944;
  font-weight:650;
  padding:12px 12px 10px;
  border-bottom:1px solid rgba(25,25,25,.10);
  text-align:left;
  white-space:nowrap;
}
tbody td{
  padding:15px 12px 16px;
  vertical-align:top;
  border-bottom:1px solid rgba(25,25,25,.045);
  max-width:330px;
  background:transparent;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.30)}
td.rank{
  width:58px;
  text-align:right;
  color:rgba(122,61,44,.78);
  font-family:Georgia,serif;
  font-size:.90rem;
  font-variant-numeric:tabular-nums;
}
td.book{
  min-width:220px;
  font-weight:650;
  letter-spacing:-.01em;
}
td.core{min-width:360px}
td.role,td.domain{white-space:nowrap}
.pill{
  display:inline-block;
  padding:0;
  color:#5f5b56;
}
@media(max-width:1000px){
  main{width:min(100% - 28px, 1520px);padding-top:40px}
  .masthead{grid-template-columns:1fr;gap:22px}
  .controls{margin-left:0}
  .controls{grid-template-columns:1fr 1fr}
  .count{justify-content:flex-start}
}
@media(max-width:720px){
  .controls{margin-left:0;grid-template-columns:1fr}
  h1{font-size:3.1rem}
  .deck{font-size:.95rem}
  .table-frame{max-height:none}
}
@media print{
  body{background:white}
  main{width:100%;padding:0}
  .controls{display:none}
  .table-frame{max-height:none;overflow:visible}
  thead th{position:static;background:white}
  table{font-size:7.2pt}
  .masthead{break-after:avoid}
}

tbody tr:nth-child(5n) td{
  border-bottom-color:rgba(25,25,25,.085);
}


.site-footer{
  margin-top:34px;
  padding-top:10px;
  color:rgba(25,25,25,.42);
  font-size:.74rem;
  letter-spacing:.035em;
  text-align:right;
}

</style>
</head>

</main>

const tbody = document.querySelector('#books-body');
const search = document.querySelector('#search');
const domain = document.querySelector('#domain');
const reliability = document.querySelector('#reliability');
const count = document.querySelector('#count');

const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

function render(){
  const q = search.value.trim().toLowerCase();
  const d = domain.value;
  const rel = reliability.value;

  const filtered = rows.filter(r=>{
    const blob = Object.values(r).join(' ').toLowerCase();
    return (!q || blob.includes(q)) &&
           (!d || r['领域']===d) &&
           (!rel || String(r['可靠性']).includes(rel));
  });

  tbody.innerHTML = filtered.map(r=>`
    <tr>
      <td class="rank">${esc(r['顺位'])}</td>
      <td class="book">${esc(r['书名'])}</td>
      <td>${esc(r['英文/原名'])}</td>
      <td>${esc(r['作者'])}</td>
      <td class="core">${esc(r['核心价值'])}</td>
      <td class="role"><span class="pill">${esc(r['阅读定位'])}</span></td>
      <td>${esc(r['可靠性'])}</td>
      <td>${esc(r['耐久性'])}</td>
      <td class="domain">${esc(r['领域'])}</td>
    </tr>
  `).join('');

  count.textContent = `${filtered.length} / ${rows.length}`;
}
[search,domain,reliability].forEach(el=>{
  el.addEventListener(el===search ? 'input' : 'change', render);
});
render();
