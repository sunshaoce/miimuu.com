<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>风之诗 · 简版</title>
  <style>
    :root {
      --bg-from: #eaf3ff;
      --bg-to: #e6fff7;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, var(--bg-from), var(--bg-to));
      overflow: hidden;
    }

    .haze {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .75;
      background:
        radial-gradient(60% 70% at 40% 10%, rgba(59, 130, 246, .18), transparent),
        radial-gradient(80% 90% at 80% 30%, rgba(56, 189, 248, .18), transparent);
      background-size: 200% 200%;
      animation: drift 50s linear infinite;
    }

    .clouds {
      position: fixed;
      left: -30vw;
      right: -30vw;
      top: -8vh;
      height: 60vh;
      pointer-events: none;
      filter: blur(8px);
      background:
        radial-gradient(closest-side, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 70%) 0 20%,
        radial-gradient(closest-side, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 70%) 20% 40%,
        radial-gradient(closest-side, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0) 70%) 60% 10%;
      background-repeat: no-repeat;
      background-size: 42vmax 18vmax, 36vmax 16vmax, 50vmax 20vmax;
      animation: sway 36s ease-in-out infinite;
    }

    .gusts {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .gusts path {
      stroke: currentColor;
      stroke-opacity: .06;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 14s ease-in-out infinite;
    }

    .gusts path:nth-child(2) {
      stroke-opacity: .05;
      stroke-width: 18;
      animation-duration: 16s;
    }

    .gusts path:nth-child(1) {
      stroke-opacity: .04;
      stroke-width: 22;
      animation-duration: 18s;
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .p {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .2);
      filter: blur(.4px);
      animation: fly var(--dur, 10s) ease-in-out var(--delay, 0s) infinite;
      transform: translate3d(-5vw, 0, 0) rotate(0deg);
    }

    .meadow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36vh;
      pointer-events: none;
    }

    .meadow>div {
      position: absolute;
      left: 0;
      right: 0;
      height: 10vh;
      background: repeating-linear-gradient(90deg, rgba(16, 185, 129, .12) 0 8px, rgba(16, 185, 129, .06) 8px 16px);
      filter: blur(2px);
      animation: sway 18s ease-in-out infinite;
    }

    .poem {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 12vh auto 20vh;
      padding: 40px 44px;
      background: none;
      text-align: center;
    }

    h1 {
      margin: 0 0 18px;
      font-weight: 600;
      font-size: 30px;
      letter-spacing: .5px;
      color: #1e3a8a;
    }

    p {
      margin: 10px 0;
      font-size: 18px;
      line-height: 1.9;
      color: rgba(15, 23, 42, 0.8);
      text-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }

    .line {
      display: inline-block;
      animation: breeze 6s ease-in-out infinite;
    }

    .line:nth-child(odd) {
      animation-duration: 7s;
    }

    @keyframes drift {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 100% 100%;
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: skewX(0deg) translateX(0);
      }

      50% {
        transform: skewX(3deg) translateX(6px);
      }
    }

    @keyframes draw {
      0% {
        stroke-dashoffset: 1000;
      }

      50% {
        stroke-dashoffset: 0;
      }

      100% {
        stroke-dashoffset: 1000;
      }
    }

    @keyframes fly {
      0% {
        transform: translate3d(-5vw, 0, 0) rotate(0);
      }

      50% {
        transform: translate3d(50vw, var(--v, 0px), 0) rotate(var(--r, 10deg));
      }

      100% {
        transform: translate3d(105vw, 0, 0) rotate(0);
      }
    }

    @keyframes breeze {
      0% {
        transform: translateX(0) skewX(0deg);
      }

      30% {
        transform: translateX(2px) skewX(1deg);
      }

      60% {
        transform: translateX(-1px) skewX(-.8deg);
      }

      100% {
        transform: translateX(0) skewX(0deg);
      }
    }
  </style>
</head>

<body>
  <div class="haze" aria-hidden="true"></div>
  <div class="clouds" aria-hidden="true"></div>

  <svg class="gusts" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-hidden="true">
    <path d="M -200 260 C 120 200, 420 320, 740 260 S 1400 240, 1600 280" stroke-width="22" />
    <path d="M -200 340 C 160 260, 440 360, 760 300 S 1380 280, 1600 320" stroke-width="18" />
    <path d="M -200 420 C 200 320, 460 400, 780 360 S 1360 360, 1600 400" stroke-width="14" />
  </svg>

  <div class="particles" aria-hidden="true" id="particles"></div>

  <main class="poem">
    <h1></h1>
    <p><span class="line">我希望你能带来暴雨的讯息</span></p>
    <p><span class="line">我又躲藏在屋墙之中，避开你的侵扰</span></p>
    <p><span class="line">不知道你会到哪里</span></p>
    <p><span class="line">不知道你的万千身影</span></p>
    <p><span class="line">你是你，我是我，我们有所交集，而又匆匆路过</span></p>
  </main>

  <script>
    (function () {
      const box = document.getElementById('particles');
      const N = 52;
      for (let i = 0; i < N; i++) {
        const el = document.createElement('span');
        el.className = 'p';
        const y = (i * 37) % 100;
        const size = 2 + ((i * 7) % 7);
        const delay = (i % 12) * 0.25;
        const dur = 9 + (i % 8);
        const v = ((i * 11) % 40) - 20;
        const r = (i % 2 ? 14 : -14);
        el.style.top = y + 'vh';
        el.style.left = '-5vw';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.setProperty('--delay', delay + 's');
        el.style.setProperty('--dur', dur + 's');
        el.style.setProperty('--v', v + 'px');
        el.style.setProperty('--r', r + 'deg');
        box.appendChild(el);
      }
    })();
  </script>
</body>

</html>
