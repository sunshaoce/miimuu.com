<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeee5">
  <meta name="description" content="我期待着你能带来暴雨的气息">
  <title>风之诗</title>
  <!--
    A moving landscape with the original poem, and no interface.
    Visual references: the sheer fabric in Wyeth's Wind from the Sea,
    and the shared gust in Hokusai's Ejiri in Suruga Province.
    Wind, seeds and rooted grass follow the same traveling breeze.
  -->
  <style>
    :root {
      color-scheme: light;
      --paper: #eeeee5;
      --ink: #40554b;
      --serif: "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body { margin: 0; color: var(--ink); -webkit-font-smoothing: antialiased; }
    ::selection { color: #283f35; background: #c9d1b9; }
    .landscape { position: fixed; inset: 0; pointer-events: none; background: var(--paper); }
    .landscape > svg, .landscape > canvas { position: absolute; width: 100%; height: 100%; }
    .landscape.is-ready > svg { opacity: 0; }
    .paper-grain { position: fixed; inset: 0; pointer-events: none; opacity: .105; z-index: 2; }
    main { min-height: 100svh; position: relative; z-index: 3; display: flex; align-items: center; padding: 70px 11.2vw 25vh; }
    .poem { font-family: var(--serif); font-size: clamp(15px, 1.18vw, 19px); font-weight: 400; letter-spacing: .14em; line-height: 2.4; display: flex; flex-direction: column; gap: 29px; }
    .poem p { margin: 0; }
    .poem p:last-child { color: #566951; }
    .line { display: block; }
    .poem { animation: arrive 2.6s ease-out both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 1600px) { main { padding-left: max(11.2vw, calc((100vw - 1300px) / 2)); } }
    @media (max-width: 760px) {
      main { align-items: flex-start; padding: 21svh 9vw 23svh; }
      .poem { font-size: clamp(13px, 3.3vw, 17px); letter-spacing: .055em; line-height: 2.45; gap: 25px; }
    }
    @media (max-height: 540px) and (orientation: landscape) {
      main { padding-top: 12vh; padding-bottom: 80px; }
      .poem { font-size: 13px; line-height: 2; gap: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { .poem { animation: none; } }
  </style>
</head>
<body>
  <div class="landscape" aria-hidden="true">
    <svg viewBox="0 0 1440 960" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f1efe7"/><stop offset=".65" stop-color="#e6eade"/><stop offset="1" stop-color="#c6d2b5"/></linearGradient>
        <linearGradient id="hill" x2="0" y2="1"><stop stop-color="#adbda0" stop-opacity=".4"/><stop offset="1" stop-color="#809568" stop-opacity=".75"/></linearGradient>
      </defs>
      <path fill="url(#sky)" d="M0 0H1440V960H0Z"/>
      <circle cx="1120" cy="260" r="65" fill="#faf8eb" opacity=".8"/>
      <path d="M0 760Q350 605 700 718T1440 650V960H0Z" fill="#bfccb4" opacity=".4"/>
      <path d="M0 825Q370 714 820 813T1440 735V960H0Z" fill="url(#hill)"/>
      <g stroke="#fffef4" fill="none" stroke-linecap="round"><path d="M610 690C840 720 910 465 1380 505M625 700C850 735 930 480 1390 519" opacity=".7"/><path d="M800 640C1020 610 1080 350 1320 410" opacity=".5"/></g>
    </svg>
    <canvas id="landscape"></canvas>
  </div>
  <svg class="paper-grain" width="100%" height="100%" aria-hidden="true">
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#grain)" opacity=".36"/>
  </svg>
  <main aria-label="风之诗">
    <article class="poem">
      <p><span class="line">我期待着你能带来暴雨的气息</span><span class="line">却又躲藏在屋墙之中，忧烦你的侵扰</span></p>
      <p><span class="line">你会到哪里</span><span class="line">你的万千身影</span></p>
      <p><span class="line">你与你们、我</span><span class="line">猝然交集，彼此路过</span></p>
    </article>
  </main>
  <script>
(() => {
  'use strict';
  const canvas = document.querySelector('#landscape');
  const ctx = canvas.getContext('2d', { alpha: false });
  if (!ctx) return;
  const backdrop = document.createElement('canvas');
  const bg = backdrop.getContext('2d', { alpha: false });
  if (!bg) return;
  const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI * 2;
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const mix = (a, b, n) => a + (b - a) * n;
  let seed = 23197;
  function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  function range(a, b) { return a + random() * (b - a); }
  let width = 0, height = 0, dpr = 1, mobile = false;
  let time = 22, lastFrame = 0, frameId = 0;
  let force = .85;
  let paused = motionPreference.matches;
  let grasses = [], seeds = [], ribbons = [], gusts = [];
  let nextGust = 24;

  // Seed heads keep their local shape while the whole head sways. Retain the
  // individual strokes and their order so translucent overlaps stay identical.
  function cacheGrassShape(grass) {
    const alpha = .2 + grass.depth * .42;
    grass.stroke = `hsla(${grass.hue}, 19%, ${grass.light}%, ${alpha})`;
    grass.strokeWidth = .5 + grass.depth * .7;
    if (!grass.head) return;
    const length = (9 + grass.depth * 13) * grass.headSize;
    grass.headStroke = `rgba(104, 116, 72, ${alpha * .74})`;
    grass.seedStroke = `rgba(225, 222, 170, ${alpha * .85})`;
    grass.hairStroke = `rgba(242, 237, 197, ${alpha * .55})`;
    grass.seedWidth = 1.1 + grass.depth * .55;
    grass.headStem = new Path2D();
    grass.headStem.moveTo(0, 2); grass.headStem.lineTo(0, -length);
    grass.headDetails = [];
    for (let j = 0; j < 7; j++) {
      const f = j / 7, spread = Math.sin(f * Math.PI) * length * .22;
      const y = -f * length;
      const seedPath = new Path2D();
      seedPath.moveTo(0, y + 2); seedPath.lineTo(-spread, y - length * .18);
      seedPath.moveTo(0, y + 1); seedPath.lineTo(spread, y - length * .2);
      const hairPath = new Path2D();
      hairPath.moveTo(-spread, y - length * .18); hairPath.lineTo(-spread * 1.4, y - length * .36);
      hairPath.moveTo(spread, y - length * .2); hairPath.lineTo(spread * 1.3, y - length * .38);
      grass.headDetails.push({ seedPath, hairPath });
    }
  }

  // Cache the still landscape. Only wind and plants are redrawn every frame.
  function paintBackdrop() {
    bg.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sky = bg.createLinearGradient(0, 0, width * .2, height);
    sky.addColorStop(0, '#f3f0e9'); sky.addColorStop(.47, '#e9ede3');
    sky.addColorStop(.76, '#dce4d4'); sky.addColorStop(1, '#b7c9a3');
    bg.fillStyle = sky; bg.fillRect(0, 0, width, height);
    const sunX = width * .79, sunY = height * (mobile ? .24 : .28);
    const halo = bg.createRadialGradient(sunX, sunY, 4, sunX, sunY, width * .24);
    halo.addColorStop(0, '#fff9e982'); halo.addColorStop(.3, '#faf5e83d'); halo.addColorStop(1, '#faf5e800');
    bg.fillStyle = halo; bg.fillRect(0, 0, width, height);
    bg.beginPath(); bg.arc(sunX, sunY, Math.min(width, height) * .052, 0, TAU);
    bg.fillStyle = '#fffbed91'; bg.fill();

    for (let layer = 0; layer < 4; layer++) {
      const base = height * (.73 + layer * .069);
      const fill = bg.createLinearGradient(0, base - 70, 0, height);
      fill.addColorStop(0, ['#a9bdae25', '#a1b5a031', '#9bb29448', '#92a97c65', '#7a93638a'][layer]);
      fill.addColorStop(1, ['#c6d2bd30', '#b9c9ac40', '#a4ba925a', '#95ac7b7a', '#879e6994'][layer]);
      bg.filter = `blur(${(4 - layer) * 1.5}px)`;
      bg.fillStyle = fill; bg.beginPath(); bg.moveTo(-10, height + 10);
      for (let x = -10; x <= width + 12; x += 8) {
        const u = x / width;
        const y = base + Math.sin(u * 4.6 + layer * 1.15) * height * .023
          + Math.cos(u * 9 + layer * 2) * height * .007 - u * height * .025;
        bg.lineTo(x, y);
      }
      bg.lineTo(width + 12, height + 10); bg.closePath(); bg.fill();
    }
    bg.filter = 'none';
    for (let i = 0; i < Math.min(width * 2, 2800); i++) {
      const x = range(0, width), y = range(height * .83, height * 1.02);
      const length = range(2, 15) * ((y / height - .72) * 2.5);
      bg.strokeStyle = `rgba(80, 109, 65, ${range(.025, .10)})`;
      bg.lineWidth = .55; bg.beginPath(); bg.moveTo(x, y);
      bg.quadraticCurveTo(x + length * .2, y - length * .7, x + length * .55, y - length);
      bg.stroke();
    }
    // A pale clearing lets the original poem sit quietly against the scenery.
    const clearing = bg.createRadialGradient(width * .22, height * .4, 0, width * .22, height * .4, width * (mobile ? .85 : .46));
    clearing.addColorStop(0, '#f1f0e658'); clearing.addColorStop(.62, '#f1f0e625'); clearing.addColorStop(1, '#f1f0e600');
    bg.fillStyle = clearing; bg.fillRect(0, 0, width, height);
  }

  function buildScene() {
    seed = 23197;
    mobile = width <= 760;
    grasses = []; seeds = []; ribbons = []; gusts = [];
    const count = Math.round(Math.min(width * .55, 760));
    for (let i = 0; i < count; i++) {
      const x = range(-30, width + 30);
      const depth = Math.pow(random(), .65);
      const edge = Math.pow(Math.abs(x / width - .48) * 2, 1.6);
      const base = height * (.88 + depth * .18);
      const length = (22 + depth * 90 + edge * 70) * range(.45, 1.2) * (mobile ? .7 : 1);
      grasses.push({ x, y: base, length, depth, lean: range(-.22, .4), phase: range(0, TAU),
        hue: range(68, 88), light: range(31, 49), head: random() < .26, bend: .25,
        headSize: range(.7, 1.25), leaf: random() < .6 });
    }
    grasses.sort((a, b) => a.depth - b.depth);
    grasses.forEach(cacheGrassShape);
    for (let i = 0; i < (mobile ? 17 : 29); i++) {
      seeds.push({ x: range(-40, width), y: range(height * .34, height * .9), phase: range(0, TAU),
        size: range(.65, 1.4), depth: range(.35, 1), spin: range(-.8, .8), kind: i % 4 });
    }
    // A ribbon is a traveling, tapered window into a continuous streamline.
    // Its neighboring filaments breathe at slightly different rates.
    for (let i = 0; i < (mobile ? 9 : 14); i++) {
      ribbons.push({ phase: range(0, 1), duration: range(11, 19), lane: i / (mobile ? 9 : 14),
        length: range(.24, .42), amplitude: range(.014, .032), phaseY: range(0, TAU),
        curl: i % 3 === 0, strands: i % 3 === 0 ? 5 : 3, opacity: range(.46, .76),
        samples: Array.from({ length: 66 }, () => ({ x: 0, y: 0, spread: 0, wave: 0, gustOffsets: [] }))
      });
    }
    paintBackdrop();
  }

  function resize() {
    width = innerWidth; height = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = backdrop.width = Math.round(width * dpr);
    canvas.height = backdrop.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildScene(); draw(0);
    document.querySelector('.landscape').classList.add('is-ready');
  }

  // Broad traveling gusts couple the air, the airborne seeds, and each stem.
  function windAt(x, y) {
    let value = force * (.64 + .19 * Math.sin(time * .54 - x * .004)
      + .12 * Math.sin(time * .91 - x * .009 + y * .003));
    for (const gust of gusts) {
      const dx = (x - gust.x) / (width * .18 + 70);
      const dy = (y - gust.y) / (height * .4);
      value += Math.exp(-dx * dx - dy * dy) * gust.power;
    }
    return value;
  }

  function sampleFlow(u, ribbon, point) {
    const curlEnvelope = Math.exp(-Math.pow((u - .76) / .18, 2));
    const curlPhase = (u - .6) * 26 - time * .22 + ribbon.phaseY;
    const curl = ribbon.curl ? 1 : .12;
    const x = u * width + Math.sin(curlPhase) * curlEnvelope * width * .022 * curl;
    const arch = Math.exp(-Math.pow((u - .75) / .27, 2));
    const base = mobile ? .75 + ribbon.lane * .12 : .64 + ribbon.lane * .19;
    const lift = mobile ? .13 : .17;
    const aspect = Math.min(1, width / height);
    point.y = height * (base - arch * lift
      + aspect * (Math.sin(u * 8.5 + ribbon.phaseY + time * .14) * ribbon.amplitude
      + Math.sin(u * 17 - time * .21 + ribbon.phaseY) * .009
      + Math.cos(curlPhase) * curlEnvelope * .038 * curl));
    point.x = x;
    point.spread = 1.4 + arch * 2.8;
    point.wave = Math.sin(u * 3 + ribbon.phaseY + time * .16);
    point.gustOffsets.length = gusts.length;
    for (let i = 0; i < gusts.length; i++) {
      const gust = gusts[i];
      const falloff = Math.exp(-Math.pow((x - gust.x) / (width * .2 + 70), 2));
      point.gustOffsets[i] = falloff * gust.power * 15 * Math.sin(u * 9 + ribbon.phaseY);
    }
  }

  function strandY(point, strand) {
    let y = point.y + strand * point.spread * point.wave;
    for (const offset of point.gustOffsets) y -= offset;
    return y;
  }

  function drawWind() {
    ctx.lineCap = 'round';
    for (const ribbon of ribbons) {
      const progress = (time / ribbon.duration + ribbon.phase) % 1;
      const head = progress * (1.5 + ribbon.length) - .16;
      const tail = head - ribbon.length;
      const life = Math.pow(Math.sin(progress * Math.PI), .65);
      const points = ribbon.samples;
      sampleFlow(tail, ribbon, points[0]);
      for (let step = 1; step <= 64; step++) {
        sampleFlow(mix(tail, head, step / 64), ribbon, points[step]);
      }
      sampleFlow(head, ribbon, points[65]);
      const center = (tail + head) / 2;
      const textFade = mobile ? .83 : clamp((center - .25) * 2.1, .12, 1);
      for (let strand = 0; strand < ribbon.strands; strand++) {
        const p = points[0], end = points[65];
        const startY = strandY(p, strand), endY = strandY(end, strand);
        const opacity = ribbon.opacity * life * textFade * (strand === 0 ? 1 : .5);
        const color = strand === 1 ? '109, 139, 116' : '255, 255, 241';
        const alpha = strand === 1 ? opacity * .62 : opacity;
        // Continuous transparency avoids visible joins in the dissolving tail.
        const fade = ctx.createLinearGradient(p.x, startY, end.x, endY);
        fade.addColorStop(0, `rgba(${color}, 0)`);
        fade.addColorStop(.2, `rgba(${color}, ${alpha * .3})`);
        fade.addColorStop(.62, `rgba(${color}, ${alpha})`);
        fade.addColorStop(.85, `rgba(${color}, ${alpha * .6})`);
        fade.addColorStop(1, `rgba(${color}, 0)`);
        ctx.beginPath(); ctx.moveTo(p.x, startY);
        for (let step = 1; step <= 64; step++) {
          const q = points[step];
          ctx.lineTo(q.x, strandY(q, strand));
        }
        ctx.strokeStyle = fade;
        ctx.lineWidth = (strand === 0 ? 1.4 : .65) * (mobile ? .85 : 1);
        ctx.stroke();
      }
    }
  }

  function drawGrass(dt) {
    ctx.lineCap = 'round';
    for (const grass of grasses) {
      const localWind = windAt(grass.x, grass.y);
      const target = grass.lean + localWind * .45 + Math.sin(time * 1.3 + grass.phase) * .055;
      // Frame-rate independent settling: a rooted stem reacts with a slight lag.
      grass.bend += (target - grass.bend) * (dt ? 1 - Math.exp(-dt * (2.5 - grass.depth)) : 1);
      const bend = grass.bend, length = grass.length;
      const tipX = grass.x + length * Math.sin(bend);
      const tipY = grass.y - length * Math.cos(bend * .73);
      const cx = grass.x + length * bend * .2, cy = grass.y - length * .6;
      ctx.strokeStyle = grass.stroke;
      ctx.lineWidth = grass.strokeWidth;
      ctx.beginPath(); ctx.moveTo(grass.x, grass.y);
      ctx.quadraticCurveTo(cx, cy, tipX, tipY); ctx.stroke();
      if (grass.leaf) {
        const leafY = grass.y - length * .38, dir = grass.phase > Math.PI ? 1 : -1;
        ctx.beginPath(); ctx.moveTo(grass.x + length * bend * .09, leafY);
        ctx.quadraticCurveTo(grass.x + dir * length * .16, leafY - length * .3,
          grass.x + dir * length * .28 + length * bend * .23, leafY - length * .37);
        ctx.stroke();
      }
      if (!grass.head) continue;
      const angle = Math.atan2(tipY - cy, tipX - cx) + Math.PI / 2;
      ctx.save(); ctx.translate(tipX, tipY); ctx.rotate(angle);
      ctx.strokeStyle = grass.headStroke;
      ctx.lineWidth = .55; ctx.stroke(grass.headStem);
      for (const detail of grass.headDetails) {
        ctx.strokeStyle = grass.seedStroke;
        ctx.lineWidth = grass.seedWidth; ctx.stroke(detail.seedPath);
        ctx.strokeStyle = grass.hairStroke;
        ctx.lineWidth = .45; ctx.stroke(detail.hairPath);
      }
      ctx.restore();
    }
  }

  function drawSeeds(dt) {
    for (const item of seeds) {
      const localWind = windAt(item.x, item.y);
      item.x += dt * (18 + localWind * 32) * item.depth;
      item.y += dt * (Math.sin(time * .8 + item.phase) * 9 - localWind * 3) * item.depth;
      if (item.x > width + 30 || item.y < height * .15) {
        item.x = -20; item.y = range(height * (mobile ? .65 : .4), height * .91);
      }
      const fade = Math.min(clamp(item.x / 70, 0, 1), clamp((width - item.x) / 70, 0, 1));
      const textFade = item.x < width * .48 && item.y < height * .72 ? .33 : 1;
      ctx.save(); ctx.translate(item.x, item.y);
      ctx.rotate(Math.sin(time * .7 + item.phase) * .5 + item.spin);
      ctx.scale(item.size, item.size); ctx.globalAlpha = fade * textFade * .72;
      if (item.kind === 0) {
        // A grass seed with a loose, translucent crown.
        ctx.strokeStyle = '#647953'; ctx.lineWidth = .65;
        ctx.beginPath(); ctx.moveTo(0, 4); ctx.quadraticCurveTo(1, 0, 0, -4); ctx.stroke();
        ctx.strokeStyle = '#ffffef'; ctx.lineWidth = .6;
        for (let n = 0; n < 6; n++) {
          const angle = Math.PI + n / 5 * Math.PI;
          ctx.beginPath(); ctx.moveTo(0, -3);
          ctx.quadraticCurveTo(Math.cos(angle) * 3, -6, Math.cos(angle) * 5, -3 + Math.sin(angle) * 5); ctx.stroke();
        }
      } else if (item.kind === 1) {
        ctx.fillStyle = '#8d9c6c'; ctx.beginPath(); ctx.moveTo(-3, 0);
        ctx.quadraticCurveTo(0, -3 * Math.cos(time + item.phase), 4, 0);
        ctx.quadraticCurveTo(0, 2, -3, 0); ctx.fill();
      } else {
        ctx.fillStyle = '#fffdef'; ctx.beginPath(); ctx.ellipse(0, 0, 1.6, .7, -.4, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  function draw(dt) {
    ctx.drawImage(backdrop, 0, 0, width, height);
    drawWind(); drawGrass(dt); drawSeeds(dt);
  }

  function frame(now) {
    frameId = 0;
    if (paused || document.hidden) return;
    const dt = lastFrame ? Math.min((now - lastFrame) / 1000, .05) : 0;
    lastFrame = now;
    time += dt * .82;
    // The wind rises and falls by itself, without a repeating start/stop gesture.
    force = .8 + Math.sin(time * .17) * .21 + Math.sin(time * .39) * .1;
    gusts = gusts.filter(gust => gust.power > .025 && gust.x < width * 1.4);
    for (const gust of gusts) { gust.x += dt * 105; gust.power *= Math.exp(-dt * .16); }
    if (time > nextGust) {
      gusts.push({ x: -width * .15, y: height * .77, power: range(.6, 1.15) });
      nextGust = time + range(7, 13);
    }
    draw(dt);
    frameId = requestAnimationFrame(frame);
  }

  function startFrames() {
    if (!frameId && !paused && !document.hidden) { lastFrame = 0; frameId = requestAnimationFrame(frame); }
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 140);
  }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(frameId); frameId = 0; }
    else startFrames();
  });
  motionPreference.addEventListener('change', event => {
    paused = event.matches;
    if (paused) { cancelAnimationFrame(frameId); frameId = 0; }
    startFrames();
  });
  window.addEventListener('pagehide', () => { cancelAnimationFrame(frameId); frameId = 0; });
  window.addEventListener('pageshow', startFrames);
  resize(); startFrames();
})();
  </script>
</body>
</html>
