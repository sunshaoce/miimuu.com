<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3ee">
  <meta name="description" content="此间，收集一些喜欢的事物。关于感受、阅读、日常，以及尚未命名的好奇。">
  <title>此间 · miimuu</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f3ee;
      --ink: #39463f;
      --muted: #5d6857;
      --line: #43543e23;
      --accent: #58684d;
      --serif: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 320px; background: var(--paper); scrollbar-gutter: stable; }
    body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background: radial-gradient(ellipse at 94% 6%, #dee4d6a3, transparent 46%),
        radial-gradient(ellipse at 1% 85%, #e6ded880, transparent 40%);
    }
    button, input { font: inherit; color: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    ::selection { background: #d8dfcd; color: #283a2b; }
    .shell { width: min(1060px, calc(100% - 112px)); margin: 0 auto; min-height: 100svh; display: flex; flex-direction: column; }
    .masthead { padding-top: 42px; display: flex; align-items: center; justify-content: space-between; }
    .signature { font: italic 23px Georgia, serif; letter-spacing: -.045em; }
    .home { min-height: 44px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
    .home svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.2; fill: none; }
    .home:hover { color: var(--ink); }
    .intro { position: relative; padding: 66px 0 55px; }
    h1 { margin: 0 0 19px; font: 400 54px/1.2 var(--serif); letter-spacing: .16em; }
    .intro p { margin: 0; font: 14px/2 var(--serif); letter-spacing: .13em; color: var(--muted); }
    .still-life { position: absolute; right: 58px; top: 57px; width: 175px; height: 130px; pointer-events: none; }
    .still-life::before, .still-life::after { content: ""; position: absolute; border-radius: 50%; }
    .still-life::before { width: 112px; height: 112px; right: 39px; top: 0; background: linear-gradient(145deg, #d9dece60, #b5c0a394); }
    .still-life::after { width: 83px; height: 83px; right: 0; top: 45px; border: 1px solid #acb29974; background: #f3f1e421; }
    main { display: grid; grid-template-columns: 150px minmax(0, 1fr); column-gap: 56px; align-items: start; flex: 1; }
    main.no-filters { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: sticky; top: 28px; max-height: calc(100svh - 56px); overflow-y: auto; padding: 9px 7px 14px 0; }
    .sidebar-label { margin: 0 0 20px; font-size: 10px; font-weight: 400; letter-spacing: .2em; color: var(--muted); }
    .filters { display: flex; flex-direction: column; gap: 5px; }
    .filter { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; border: 0; border-radius: 4px; background: transparent; text-align: left; color: var(--muted); font-size: 12px; letter-spacing: .07em; transition: background-color .18s, color .18s; }
    .filter span:first-child { overflow-wrap: anywhere; }
    .filter-count { font: 11px Georgia, serif; letter-spacing: .03em; flex-shrink: 0; }
    .filter[aria-pressed="true"] { background: #dee4d575; color: #3f553a; }
    .filter:hover { color: #34482e; background: #e0e5d749; }
    .catalogue { min-width: 0; }
    .toolbar { display: flex; gap: 24px; align-items: center; justify-content: space-between; min-height: 48px; margin-bottom: 14px; }
    .list-heading { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    h2 { font-size: 12px; font-weight: 400; letter-spacing: .12em; margin: 0; overflow-wrap: anywhere; }
    .result-count { color: var(--muted); font-size: 10px; white-space: nowrap; letter-spacing: .03em; }
    .search { display: flex; align-items: center; gap: 9px; flex: 0 0 226px; border-bottom: 1px solid #6b78673d; min-width: 0; min-height: 44px; }
    .search:focus-within { border-color: #58684d; }
    .search > svg { flex: 0 0 15px; width: 15px; height: 15px; fill: none; stroke: #7d8676; stroke-width: 1.3; }
    .search input { width: 100%; min-width: 0; height: 42px; padding: 0; border: 0; outline: none; background: transparent; font-size: 12px; appearance: none; -webkit-appearance: none; }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
    .clear-search { flex: 0 0 44px; height: 44px; border: 0; padding: 9px; background: transparent; display: grid; place-items: center; }
    .clear-search svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.2; }
    .entries { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
    .entries > a { min-height: 126px; padding: 28px 2px; border-bottom: 1px solid var(--line); font: 20px/1.5 var(--serif); letter-spacing: .05em; overflow-wrap: anywhere; transition: background-color .2s; }
    .entries > a:hover { background-color: #e4e8dc40; }
    .entries > a.enhanced { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto 18px; gap: 23px; align-items: center; content-visibility: auto; contain-intrinsic-size: auto 70px; }
    .entry-mark { width: 58px; height: 64px; display: grid; place-items: center; border-radius: 50% 50% 4px 4px; background: #dfe6d780; color: #788665; font: 25px/1 var(--serif); letter-spacing: 0; }
    .entries > a[data-category="阅读"] .entry-mark { border-radius: 3px; background: #e6e0d68a; color: #91816e; }
    .entries > a[data-category="日常"] .entry-mark { border-radius: 50%; background: #dfe2e78c; color: #7d8693; }
    .entry-copy { min-width: 0; }
    .entry-title { display: block; font: 400 20px/1.6 var(--serif); letter-spacing: .065em; }
    .entry-description { display: block; margin-top: 6px; font: 12px/1.8 var(--sans); letter-spacing: .035em; color: var(--muted); }
    .entry-category { color: var(--muted); font: 10px/1.6 var(--sans); letter-spacing: .08em; max-width: 110px; }
    .entry-arrow { width: 16px; height: 16px; position: relative; opacity: .5; transition: transform .2s, opacity .2s; }
    .entry-arrow::before { content: ""; position: absolute; top: 8px; left: 1px; width: 12px; height: 1px; background: currentColor; }
    .entry-arrow::after { content: ""; position: absolute; top: 4px; right: 2px; width: 8px; height: 8px; border-right: 1px solid; border-top: 1px solid; transform: rotate(45deg); }
    .entries > a:hover .entry-arrow, .entries > a:focus-visible .entry-arrow { transform: translateX(3px); opacity: 1; }
    .empty { padding: 66px 16px; text-align: center; }
    .empty p { margin: 0 0 12px; font: 18px/1.6 var(--serif); }
    .empty span { font-size: 12px; color: var(--muted); line-height: 1.8; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 58px 0 29px; color: var(--muted); font-size: 10px; letter-spacing: .1em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 72px); }
      main { column-gap: 32px; grid-template-columns: 125px minmax(0, 1fr); }
      .entries > a.enhanced { gap: 17px; grid-template-columns: 50px minmax(0, 1fr) 16px; }
      .entry-mark { width: 50px; height: 57px; }
      .entry-category { display: none; }
      .entry-title { font-size: 18px; }
      .search { flex-basis: 195px; }
    }
    @media (max-width: 640px) {
      .shell { width: calc(100% - 44px); }
      .masthead { padding-top: 20px; }
      .signature { font-size: 21px; }
      .intro { padding: 46px 0 32px; }
      h1 { font-size: 44px; margin-bottom: 18px; }
      .intro p { font-size: 12px; max-width: 220px; line-height: 2; }
      .still-life { right: 1px; top: 45px; transform: scale(.66); transform-origin: top right; }
      main { display: flex; flex-direction: column; gap: 23px; }
      .sidebar { position: static; width: 100%; overflow: visible; max-height: none; padding: 0; }
      .sidebar-label { display: none; }
      .filters { flex-direction: row; gap: 5px; overflow-x: auto; padding: 5px; margin: -5px; }
      .filter { flex: 0 0 auto; gap: 12px; min-height: 44px; padding: 10px 13px; font-size: 12px; }
      .catalogue { width: 100%; }
      .toolbar { flex-wrap: wrap; gap: 14px; margin-bottom: 9px; }
      .list-heading { flex: 1 0 90px; }
      .search { flex: 1 1 145px; }
      .entries > a, .entries > a.enhanced { min-height: 115px; padding: 24px 0; }
      .entries > a.enhanced { gap: 16px; grid-template-columns: 45px minmax(0, 1fr) 14px; contain-intrinsic-size: auto 67px; }
      .entry-mark { width: 45px; height: 52px; font-size: 23px; }
      .entry-title { font-size: 17px; letter-spacing: .035em; }
      .entry-description { font-size: 11px; letter-spacing: 0; }
      footer { padding-top: 44px; padding-bottom: 25px; font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <span class="signature">miimuu</span>
      <a class="home" href="../index.html"><span>返回首页</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"></path></svg></a>
    </header>
    <div class="intro">
      <h1>此间</h1>
      <p>收集一些喜欢的事物，<br>也留一些位置，给未知的好奇。</p>
      <div class="still-life" aria-hidden="true"></div>
    </div>
    <main class="no-filters" id="directory">
      <aside class="sidebar" id="sidebar" hidden>
        <h2 class="sidebar-label">分类</h2>
        <div class="filters" id="filters" role="group" aria-label="按分类浏览"></div>
      </aside>
      <section class="catalogue" aria-labelledby="list-title">
        <div class="toolbar">
          <div class="list-heading"><h2 id="list-title">全部内容</h2><span class="result-count" id="result-count" hidden></span></div>
          <div class="search" id="search-box" role="search" hidden>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.8"></circle><path d="m13 13 4 4"></path></svg>
            <label class="sr-only" for="search">搜索目录</label>
            <input id="search" type="search" placeholder="搜索标题、内容…" autocomplete="off" spellcheck="false">
            <button class="clear-search" id="clear-search" type="button" aria-label="清空搜索" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button>
          </div>
        </div>
        <nav class="entries" id="entries" aria-label="页面目录">
          <!--
            新增页面：在下面加一行链接即可，不用修改 CSS 或 JavaScript。
            最简单：<a href="new.html">新页面</a>
            完整写法：<a href="new.html" data-category="分类" data-description="一句简介" data-mark="新">新页面</a>
            分类、简介、封面字均可省略；分类会自动收录，未填写时归入「未分类」。
            可选 data-keywords="别名 关键词"，用于补充搜索；链接顺序就是目录顺序。
          -->
          <a href="wind.html" data-category="感受" data-description="让风经过，也让心慢下来。" data-mark="风">风</a>
          <a href="reading_list.html" data-category="阅读" data-description="从一本书出发，慢慢认识更大的世界。" data-mark="书">现代成年人通识书单</a>
          <a href="timer.html" data-category="日常" data-description="一段专注，一次休息，找回自己的节奏。" data-mark="时">专注 · 休息</a>
        </nav>
        <div class="empty" id="empty" hidden><p>暂时没有匹配的内容</p><span>换一个关键词，或选择其他分类。</span></div>
        <p class="sr-only" id="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
    </main>
    <footer><span>LOVE &amp; CODE</span><span>日常有隙，喜欢有处。</span></footer>
  </div>
  <script>
    (() => {
      'use strict';
      const entries = document.querySelector('#entries');
      const search = document.querySelector('#search');
      const filters = document.querySelector('#filters');
      const clearButton = document.querySelector('#clear-search');
      const heading = document.querySelector('#list-title');
      const count = document.querySelector('#result-count');
      const empty = document.querySelector('#empty');
      const status = document.querySelector('#search-status');
      const normalize = value => value.normalize('NFKC').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
      const categories = new Map();
      const makeSpan = (className, value) => {
        const span = document.createElement('span');
        span.className = className;
        span.textContent = value;
        return span;
      };

      // Read the ordinary links once. They are also the no-JavaScript fallback.
      // Keep the search index in memory; typing never recreates catalogue nodes.
      const items = Array.from(entries.children).filter(link => link.matches('a[href]')).map(link => {
        const title = link.textContent.trim();
        const category = (link.dataset.category || '').trim() || '未分类';
        const description = (link.dataset.description || '').trim();
        categories.set(category, (categories.get(category) || 0) + 1);
        const mark = makeSpan('entry-mark', link.dataset.mark || Array.from(title)[0] || '·');
        mark.setAttribute('aria-hidden', 'true');
        const copy = makeSpan('entry-copy', '');
        copy.append(makeSpan('entry-title', title));
        if (description) copy.append(makeSpan('entry-description', description));
        const arrow = makeSpan('entry-arrow', '');
        arrow.setAttribute('aria-hidden', 'true');
        link.replaceChildren(mark, copy, makeSpan('entry-category', category), arrow);
        link.classList.add('enhanced');
        return { link, category, searchText: normalize([title, description, category, link.dataset.keywords || ''].join(' ')) };
      });

      const groups = [null, ...categories.keys()];
      const fragment = document.createDocumentFragment();
      const buttons = groups.map((category, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'filter';
        button.dataset.index = index;
        button.setAttribute('aria-pressed', String(index === 0));
        button.append(makeSpan('filter-label', category === null ? '全部' : category));
        button.append(makeSpan('filter-count', category === null ? items.length : categories.get(category)));
        fragment.append(button);
        return button;
      });
      filters.append(fragment);
      let activeGroup = 0, timer = 0, composing = false;

      function applyFilter(announce = true) {
        const query = normalize(search.value);
        const terms = query ? query.split(' ') : [];
        const category = groups[activeGroup];
        let visible = 0;
        for (const item of items) {
          const hidden = (category !== null && item.category !== category) || !terms.every(term => item.searchText.includes(term));
          if (item.link.hidden !== hidden) item.link.hidden = hidden;
          if (!hidden) visible++;
        }
        heading.textContent = category === null ? '全部内容' : category;
        count.textContent = `${visible} 项`;
        empty.hidden = visible !== 0;
        clearButton.hidden = search.value.length === 0;
        if (announce) status.textContent = `找到 ${visible} 项内容`;
      }
      function scheduleFilter() {
        clearTimeout(timer);
        if (!composing) timer = setTimeout(applyFilter, 80);
      }
      // One delegated handler covers every current or future category.
      filters.addEventListener('click', event => {
        const button = event.target.closest('button[data-index]');
        if (!button || !filters.contains(button)) return;
        buttons[activeGroup].setAttribute('aria-pressed', 'false');
        activeGroup = Number(button.dataset.index);
        button.setAttribute('aria-pressed', 'true');
        clearTimeout(timer);
        applyFilter();
      });
      search.addEventListener('input', scheduleFilter);
      search.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
      search.addEventListener('compositionend', () => { composing = false; scheduleFilter(); });
      clearButton.addEventListener('click', () => {
        clearTimeout(timer); search.value = ''; applyFilter(); search.focus();
      });
      search.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !event.isComposing) {
          clearTimeout(timer); search.value = ''; applyFilter();
        }
      });
      document.querySelector('#sidebar').hidden = false;
      document.querySelector('#directory').classList.remove('no-filters');
      document.querySelector('#search-box').hidden = false;
      count.hidden = false;
      applyFilter(false);
      window.addEventListener('pageshow', () => applyFilter(false));
    })();
  </script>
</body>
</html>
